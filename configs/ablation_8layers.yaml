# Ablation baseline: 8-layer VLM, no memory system.
# Trains the action expert from scratch without any memory augmentation.
# Use as the control group when comparing against expert_scratch_8layers.yaml.

_base_: base.yaml

policy:
  training_mode: expert_only_scratch
  num_vlm_layers: 8

trainer:
  training_mode: expert_only_scratch
  total_steps: 200000
  expert_lr: 5.0e-5
  warmup_steps: 2000
  checkpoint_every: 10000
  wandb_run_name: ablation_8layers_no_memory

  # Standard random batching (no episode ordering needed)
  batch_size: 32
  num_workers: 4
