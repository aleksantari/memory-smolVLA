# LIBERO training v3: injection at 1/4 depth (layer 4 of 16).
# Uses residual (additive) gate — no learned gate to collapse.

_base_: base_libero.yaml

policy:
  training_mode: memory_only
  base_checkpoint: HuggingFaceVLA/smolvla_libero
  num_vlm_layers: 16
  injection_layer: 4            # 1/4 depth
  gate_type: residual

trainer:
  training_mode: memory_only
  total_steps: 100000
  memory_lr: 1.0e-3
  warmup_steps: 1000
  wandb_project: null
  checkpoint_dir: checkpoints/libero_injection_quarter_v3
