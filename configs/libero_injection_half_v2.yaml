# LIBERO training v2: injection at 1/2 depth (layer 8 of 16).
# Fixes gate_alpha=0 from v1 by using warmer gate init and higher memory LR.
#
# Changes vs v1:
#   gate_init_bias: -5.0 → -1.0 (α_init ≈ 0.27 instead of 0.007)
#   memory_lr: 1e-4 → 1e-3 (compensate for ~20000x smaller LIBERO loss)

_base_: base_libero.yaml

policy:
  training_mode: memory_only
  base_checkpoint: HuggingFaceVLA/smolvla_libero
  num_vlm_layers: 16
  injection_layer: 8            # 1/2 depth (mid-point)
  gate_init_bias: -1.0          # warmer start for low-loss LIBERO

trainer:
  training_mode: memory_only
  total_steps: 100000
  memory_lr: 1.0e-3             # 10x higher for small LIBERO gradients
  warmup_steps: 1000
  wandb_project: null
  checkpoint_dir: checkpoints/libero_injection_half_v2
