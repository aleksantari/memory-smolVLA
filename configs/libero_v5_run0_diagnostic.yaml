# Run 0 — diagnostic: batch-size fix only (no architectural change).
#
# Purpose: isolate the gradient-diversity confound from the
# architectural ablations. v4 trained at effective batch=1 (B=1 +
# grad_accum_steps=1, all 32 frames from one episode would be
# correlated even if accumulated). This config matches v4 exactly
# except:
#   * dataset.max_window_size: 32  — limit per-episode visit
#   * trainer.grad_accum_steps: 32 — accumulate one window per step
#   * trainer.total_steps: 3000   — same wall-clock as v4 30K
#
# Memory pathway is unchanged from v4: full prefix bank, residual
# gate, write_stride=1. If this run alone closes most of the
# 76% → 87.75% bypass-vs-baseline gap, then the "memory architecture
# hurts" story was largely a confound. If it doesn't, architectural
# fixes (Run 1+) are doing the real work.

_base_: base_libero.yaml

policy:
  training_mode: expert_finetune
  base_checkpoint: HuggingFaceVLA/smolvla_libero
  num_vlm_layers: 16
  injection_layer: 8
  gate_type: residual
  # No compression / write_stride / two_stream — same as v4.

dataset:
  max_window_size: 32

trainer:
  training_mode: expert_finetune
  total_steps: 3000
  grad_accum_steps: 32
  memory_lr: 1.0e-4
  expert_lr: 1.0e-5
  warmup_steps: 100
  wandb_project: memory-smolvla-libero
  wandb_run_name: v5_run0_diagnostic
  checkpoint_dir: /content/drive/MyDrive/memory-smolvla/checkpoints/v5_run0_diagnostic
  checkpoint_every: 500
