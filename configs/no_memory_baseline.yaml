# No-memory baseline: 16-layer VLM, pretrained SmolVLA action expert,
# NO memory modules. Identical architecture to memory_only.yaml but
# without the memory system. Fair control for Option A evaluation.
#
# Compare against memory_only.yaml to measure memory contribution.

_base_: base.yaml

policy:
  training_mode: expert_only_scratch
  base_checkpoint: lerobot/smolvla_base
  num_vlm_layers: 16

trainer:
  training_mode: expert_only_scratch
  total_steps: 100000
  expert_lr: 1.0e-4
  warmup_steps: 1000
  checkpoint_every: 5000
  checkpoint_dir: checkpoints/no_memory_baseline
  wandb_project: null

  batch_size: 32
  num_workers: 4
