# Base configuration — shared defaults for all training modes.
# Override specific keys in mode-specific configs.

policy:
  injection_layer: 8          # VLM layer index for memory injection (0-based, out of 16)
  bank_max_size: 16           # Max memory bank entries before consolidation
  retrieval_n_heads: 4        # Cross-attention heads in retrieval module
  gate_hidden_dim: 256        # Hidden dim of sigmoid gate MLP
  num_vlm_layers: 16          # Number of VLM transformer layers

dataset:
  repo_ids:
    - "danaaubakirova/svla_so100_task1_v3"   # Community dataset (original SmolVLA training data)
    # Add personal HuggingFace datasets below:
    # - "your_hf_username/your_dataset_name"
  delta_timestamps:
    observation.images.top: [0.0]
    observation.images.wrist: [0.0]
    observation.state: [0.0]
    action:  # 50-step action chunk at 30fps to match SmolVLA chunk_size=50
      - 0.0
      - 0.033333
      - 0.066667
      - 0.1
      - 0.133333
      - 0.166667
      - 0.2
      - 0.233333
      - 0.266667
      - 0.3
      - 0.333333
      - 0.366667
      - 0.4
      - 0.433333
      - 0.466667
      - 0.5
      - 0.533333
      - 0.566667
      - 0.6
      - 0.633333
      - 0.666667
      - 0.7
      - 0.733333
      - 0.766667
      - 0.8
      - 0.833333
      - 0.866667
      - 0.9
      - 0.933333
      - 0.966667
      - 1.0
      - 1.033333
      - 1.066667
      - 1.1
      - 1.133333
      - 1.166667
      - 1.2
      - 1.233333
      - 1.266667
      - 1.3
      - 1.333333
      - 1.366667
      - 1.4
      - 1.433333
      - 1.466667
      - 1.5
      - 1.533333
      - 1.566667
      - 1.6
      - 1.633333
  split: train
  local_cache_dir: null        # Set to a local path to cache downloaded datasets
  # Remap dataset keys to match policy's expected input_features.
  # Format: "dataset_key: policy_key"
  feature_map:
    observation.images.top: observation.images.camera1
    observation.images.wrist: observation.images.camera2

trainer:
  total_steps: 100000
  memory_lr: 1.0e-4
  expert_lr: 1.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  warmup_steps: 1000
  grad_accum_steps: 1
  checkpoint_every: 5000
  log_every: 100
  checkpoint_dir: checkpoints
  wandb_project: memory-smolvla
  wandb_run_name: null
  device: cuda
  batch_size: 32              # Only used in expert_only_scratch mode
  num_workers: 4
