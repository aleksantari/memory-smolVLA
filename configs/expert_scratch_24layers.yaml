# Expert-scratch with 24 VLM layers: randomly initialize the action
# expert, train expert + memory modules jointly with a deeper VLM.
# VLM backbone loads first 24 layers of HuggingFaceTB/SmolVLM2-500M-Video-Instruct
# (which has 30 layers total).
#
# Use for ablation: "does a deeper VLM + memory outperform 16 layers?"

_base_: base.yaml

policy:
  training_mode: expert_scratch
  num_vlm_layers: 24
  injection_layer: 12         # Mid-VLM injection at 12 of 24 layers
  bank_max_size: 16

trainer:
  training_mode: expert_scratch
  total_steps: 200000
  memory_lr: 1.0e-4
  expert_lr: 5.0e-5
  warmup_steps: 2000
  checkpoint_every: 10000
  wandb_run_name: expert_scratch_24layers
