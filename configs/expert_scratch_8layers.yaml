# Expert-scratch with 8 VLM layers: randomly initialize the action
# expert (pretrained checkpoint incompatible with 8 layers), train
# expert + memory modules jointly. VLM backbone uses pretrained weights.
#
# Use for ablation: "does memory help when the VLM is shallower?"
# Compare against ablation_8layers.yaml (no memory) for a fair baseline.

_base_: base.yaml

policy:
  training_mode: expert_scratch
  num_vlm_layers: 8
  injection_layer: 4          # Mid-VLM injection at 4 of 8 layers
  bank_max_size: 16

trainer:
  training_mode: expert_scratch
  total_steps: 200000          # Expert needs more steps to converge from scratch
  memory_lr: 1.0e-4
  expert_lr: 5.0e-5            # Lower LR for the larger expert module
  warmup_steps: 2000
  checkpoint_every: 10000
  wandb_run_name: expert_scratch_8layers
