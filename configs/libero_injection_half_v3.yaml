# LIBERO training v3: injection at 1/2 depth (layer 8 of 16).
# Uses residual (additive) gate instead of learned sigmoid gate.
# v1/v2 showed gate collapse to α≈0 on LIBERO due to weak gradients.
# Residual gate: fused = current + retrieved (no learned gate to collapse).

_base_: base_libero.yaml

policy:
  training_mode: memory_only
  base_checkpoint: HuggingFaceVLA/smolvla_libero
  num_vlm_layers: 16
  injection_layer: 8            # 1/2 depth (mid-point)
  gate_type: residual            # additive fusion, no learned gate

trainer:
  training_mode: memory_only
  total_steps: 100000
  memory_lr: 1.0e-3             # higher LR for LIBERO
  warmup_steps: 1000
  wandb_project: null
  checkpoint_dir: checkpoints/libero_injection_half_v3
