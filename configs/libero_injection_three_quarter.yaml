# LIBERO training: injection at 3/4 depth (layer 12 of 16).
# Late VLM features — high-level semantic representations.

_base_: base_libero.yaml

policy:
  training_mode: memory_only
  base_checkpoint: HuggingFaceVLA/smolvla_libero
  num_vlm_layers: 16
  injection_layer: 12           # 3/4 depth

trainer:
  training_mode: memory_only
  total_steps: 100000
  memory_lr: 1.0e-4
  warmup_steps: 1000
  wandb_project: null
  checkpoint_dir: checkpoints/libero_injection_three_quarter
