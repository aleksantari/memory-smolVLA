# V5 Run 2A — Perceiver-Resampler compressor on top of V4 optimizer hyperparameters.
#
# Tests: does a learned compressor (n_slots=4 cross-attention queries over the prefix)
# do better than mean_pool's single average token? At retrieval the bank holds
# 16 entries × 4 slots = 64 keys, vs mean_pool's 16. More capacity per memory entry
# at the cost of ~50k learnable params for the compressor itself.
#
# Recipe: V4 optimizer hyperparameters (the only ones confirmed not to overcook
# the action expert) + write_stride=50 (matches train/inference cadence) +
# learned compressor (the new architectural variable).
#
# Diffs vs v5_meanpool_v4hp:
#   policy.use_compressor      : false  -> true
#   policy.compressor_n_slots  : 8      -> 4
#   policy.compression_mode    : mean_pool -> none  (compressor handles it)

_base_: base_libero.yaml

policy:
  training_mode: expert_finetune
  base_checkpoint: HuggingFaceVLA/smolvla_libero
  num_vlm_layers: 16
  injection_layer: 8
  gate_type: residual
  write_stride: 50
  use_compressor: true
  compressor_n_slots: 4

trainer:
  training_mode: expert_finetune
  total_steps: 30000
  memory_lr: 1.0e-4
  expert_lr: 1.0e-5
  warmup_steps: 500
  wandb_project: memory-smolvla-libero
  wandb_run_name: v5_compressor_v4hp
  checkpoint_dir: checkpoints/v5_compressor_v4hp
  checkpoint_every: 5000
